<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1536 2048" 
     width="100%" 
     height="100%" 
     preserveAspectRatio="xMidYMid slice">
  
  <style>
    /* กำหนดค่าตัวแปรสีสำหรับ Light Mode (ค่าเริ่มต้น) และ Dark Mode */
    :root {
      --bg-gradient-top: #f3f0fb;
      --bg-gradient-bottom: #fceceb;
      --cloud-color: #ffffff;
      --cloud-shadow: #e6e0f8;
      --star-gold: #ffbe5c;
      --star-purple: #bca4f5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-gradient-top: #1a162b;
        --bg-gradient-bottom: #2d2035;
        --cloud-color: #3b3254;
        --cloud-shadow: #231b36;
        --star-gold: #ffcf75;
        --star-purple: #9b82e2;
      }
    }

    .bg-rect { fill: url(#skyGradient); }
    .cloud-main { fill: var(--cloud-color); opacity: 0.85; }
    .cloud-sub { fill: var(--cloud-shadow); opacity: 0.6; }
    .star-gold { fill: var(--star-gold); }
    .star-purple { fill: var(--star-purple); }
  </style>

  <defs>
    <!-- ไล่ระดับสีพื้นหลังท้องฟ้า -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-gradient-top)" />
      <stop offset="100%" stop-color="var(--bg-gradient-bottom)" />
    </linearGradient>

    <!-- รูปทรงดาว 4 แฉก -->
    <g id="sparkle">
      <path d="M 0,-15 C 2,-5 5,-2 15,0 C 5,2 2,5 0,15 C -2,5 -5,2 -15,0 C -5,-2 -2,-5 0,-15 Z" />
    </g>
  </defs>

  <!-- พื้นหลัง -->
  <rect class="bg-rect" width="1536" height="2048" />

  <!-- กลุ่มก้อนเมฆและบรรยากาศฉากหลัง -->
  <g transform="translate(0, 100)">
    <!-- ก้อนเมฆซ้าย -->
    <path class="cloud-sub" d="M 150,600 C 100,600 60,640 60,690 C 60,740 100,780 150,780 L 350,780 C 400,780 440,740 440,690 C 440,640 400,600 350,600 Z" />
    <path class="cloud-main" d="M 120,580 C 70,580 30,620 30,670 C 30,720 70,760 120,760 L 320,760 C 370,760 410,720 410,670 C 410,620 370,580 320,580 Z" />

    <!-- ก้อนเมฆขวา -->
    <path class="cloud-sub" d="M 1200,700 C 1140,700 1090,750 1090,810 C 1090,870 1140,920 1200,920 L 1420,920 C 1480,920 1530,870 1530,810 C 1530,750 1480,700 1420,700 Z" />
    <path class="cloud-main" d="M 1160,680 C 1100,680 1050,730 1050,790 C 1050,850 1100,900 1160,900 L 1380,900 C 1440,900 1490,850 1490,790 C 1490,730 1440,680 1380,680 Z" />
  </g>

  <!-- ดวงดาวและประกายระยิบระยับ (Sparkles) -->
  <use href="#sparkle" class="star-gold" transform="translate(200, 350) scale(1.2)" />
  <use href="#sparkle" class="star-gold" transform="translate(1150, 250) scale(1.8)" />
  <use href="#sparkle" class="star-gold" transform="translate(1250, 750) scale(1.4)" />
  
  <use href="#sparkle" class="star-purple" transform="translate(150, 200) scale(0.8)" />
  <use href="#sparkle" class="star-purple" transform="translate(850, 180) scale(1)" />
  <use href="#sparkle" class="star-purple" transform="translate(1350, 1850) scale(1.1)" />
  <use href="#sparkle" class="star-purple" transform="translate(250, 1850) scale(0.9)" />

</svg>
